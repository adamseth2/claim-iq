name: Synthetic seed documents

on:
  pull_request:
    paths:
      - 'server/seed/**'
      - 'server/box-draft.mjs'
      - 'src/domain/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seed-documents.yml'
  push:
    branches: [main]
    paths:
      - 'server/seed/**'
      - 'server/box-draft.mjs'
      - 'src/domain/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seed-documents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/seed/requirements.txt
            server/seed/requirements-test.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r server/seed/requirements-test.txt
      - run: npm test
      - run: npm run test:seed
      - run: python -m pytest server/seed/tests/test_documents.py -q
      - run: npm run typecheck
      - run: npm run build
